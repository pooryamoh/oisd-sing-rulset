name: Build sing-box OISD & HaGeZi Rulesets

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight Tehran time
      timezone: "Asia/Tehran"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install sing-box CLI
        run: |
          LATEST_URL=$(curl -sL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.assets[] | select(.name | test("linux-amd64.tar.gz$")) | .browser_download_url')
          echo "Downloading sing-box from $LATEST_URL"
          curl -sL "$LATEST_URL" | tar -xz
          sudo cp sing-box-*/sing-box /usr/local/bin/
          sing-box version

      - name: Fetch and Compile OISD Lists
        run: |
          OISD_LISTS=("nsfw" "big")
          
          for LIST in "${OISD_LISTS[@]}"; do
            echo "========================================"
            echo "Processing OISD $LIST list..."
            curl -fsSL "https://$LIST.oisd.nl/" -o "oisd-$LIST.txt"
            
            echo "Compiling OISD $LIST to binary SRS format..."
            sing-box rule-set convert --type adguard --output "oisd-$LIST.srs" "oisd-$LIST.txt"
            rm "oisd-$LIST.txt"
          done

      - name: Fetch and Compile HaGeZi Lists
        run: |
          # Remove "pro" if you only want the NSFW list
          HAGEZI_LISTS=("nsfw" "pro")
          
          for LIST in "${HAGEZI_LISTS[@]}"; do
            echo "========================================"
            echo "Processing HaGeZi $LIST list..."
            curl -fsSL "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/$LIST.txt" -o "hagezi-$LIST.txt"
            
            echo "Compiling HaGeZi $LIST to binary SRS format..."
            sing-box rule-set convert --type adguard --output "hagezi-$LIST.srs" "hagezi-$LIST.txt"
            rm "hagezi-$LIST.txt"
          done

      - name: Release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "latest"
          name: "Latest OISD & HaGeZi Rulesets"
          body: "Automated daily build of OISD and HaGeZi blocklists in sing-box binary (.srs) format."
          make_latest: true
          files: |
            *.srs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
